name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      POSTGRES_PASSWORD: ci-only-not-a-production-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python manage.py check
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable local credentials
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text('POSTGRES_PASSWORD=' + secrets.token_hex(24) + '\nDJANGO_SECRET_KEY=' + secrets.token_hex(48) + '\n')
          PY
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 240
      - name: Verify real HTTP endpoints and dependency failure recovery
        run: |
          curl --fail http://localhost:3000/ | grep -q 'Staff Appraisal'
          curl --fail http://localhost:8000/api/health/live/
          curl --fail http://localhost:8000/api/health/ready/
          docker compose stop redis
          test "$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/api/health/ready/)" = 503
          python -c "import json; assert json.load(open('/tmp/ready.json'))['checks']['redis'] == 'unavailable'"
          curl --fail http://localhost:8000/api/health/live/
          docker compose up -d --wait --wait-timeout 120
          curl --fail http://localhost:8000/api/health/ready/
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up disposable CI data
        if: always()
        run: docker compose down -v
